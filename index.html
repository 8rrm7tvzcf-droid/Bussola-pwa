<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bussola</title>
<meta name="description" content="Organizza itinerari, budget, checklist e prenotazioni per ogni viaggio.">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#5B4FF0">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Bussola">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
  :root{
    --paper:#F5F6FB; --surface:#FFFFFF; --surface-2:#EFF1F8;
    --ink:#10121C; --ink-2:#565B72; --muted:#8B90A6;
    --border:rgba(16,18,28,.08); --border-strong:rgba(16,18,28,.15);
    --accent:#5B4FF0; --accent-strong:#4536DE; --accent-soft:#ECEAFE; --accent-ink:#4536DE;
    --teal:#0EA5C7; --teal-soft:#E0F6FB; --teal-ink:#087691;
    --plum:#E23F97; --plum-soft:#FDE7F3; --plum-ink:#B92A78;
    --good:#12B76A; --warning:#DE8A05; --serious:#ec835a; --critical:#E5392B;
    --r-sm:10px; --r-md:14px; --r-lg:18px; --r-xl:22px;
    --shadow: 0 1px 2px rgba(16,18,28,.04), 0 10px 24px -12px rgba(16,18,28,.14);
    --shadow-lg: 0 6px 16px -4px rgba(16,18,28,.10), 0 28px 48px -24px rgba(16,18,28,.24);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#0B0D16; --surface:#151827; --surface-2:#1C2033;
      --ink:#F1F2F9; --ink-2:#B8BCD1; --muted:#80869C;
      --border:rgba(241,242,249,.09); --border-strong:rgba(241,242,249,.17);
      --accent:#8C81FF; --accent-strong:#A79DFF; --accent-soft:rgba(140,129,255,.16); --accent-ink:#B4ACFF;
      --teal:#2FD3F0; --teal-soft:rgba(47,211,240,.14); --teal-ink:#7CE7F7;
      --plum:#F472B6; --plum-soft:rgba(244,114,182,.15); --plum-ink:#F9A8D4;
      --good:#27CC81; --warning:#FDB022; --serious:#ec835a; --critical:#F97066;
      --shadow: 0 1px 2px rgba(0,0,0,.35), 0 16px 32px -16px rgba(0,0,0,.6);
      --shadow-lg: 0 8px 20px -6px rgba(0,0,0,.5), 0 32px 56px -24px rgba(0,0,0,.7);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --paper:#0B0D16; --surface:#151827; --surface-2:#1C2033;
    --ink:#F1F2F9; --ink-2:#B8BCD1; --muted:#80869C;
    --border:rgba(241,242,249,.09); --border-strong:rgba(241,242,249,.17);
    --accent:#8C81FF; --accent-strong:#A79DFF; --accent-soft:rgba(140,129,255,.16); --accent-ink:#B4ACFF;
    --teal:#2FD3F0; --teal-soft:rgba(47,211,240,.14); --teal-ink:#7CE7F7;
    --plum:#F472B6; --plum-soft:rgba(244,114,182,.15); --plum-ink:#F9A8D4;
    --good:#27CC81; --warning:#FDB022; --serious:#ec835a; --critical:#F97066;
    --shadow: 0 1px 2px rgba(0,0,0,.35), 0 16px 32px -16px rgba(0,0,0,.6);
    --shadow-lg: 0 8px 20px -6px rgba(0,0,0,.5), 0 32px 56px -24px rgba(0,0,0,.7);
    color-scheme: dark;
  }

  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:"Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.display{ font-family:"Bricolage Grotesque", "Manrope", system-ui, sans-serif; font-weight:700; letter-spacing:-.01em; text-wrap:balance; margin:0; }
  .mono{ font-family:"JetBrains Mono", ui-monospace, "SFMono-Regular", monospace; font-variant-numeric:tabular-nums; }
  button{ font-family:inherit; }
  input,select,textarea{ font-family:inherit; font-size:.92rem; }
  a{ color:var(--accent-strong); }
  ::selection{ background:var(--accent-soft); }
  :focus-visible{ outline:2px solid var(--accent); outline-offset:2px; border-radius:6px; }

  /* ---------- layout shell ---------- */
  .shell{ max-width:1180px; margin:0 auto; padding-inline:20px; padding-block:0 96px; }
  .view-bar{
    position:fixed; left:0; right:0; bottom:0; z-index:40;
    background:color-mix(in srgb, var(--paper) 90%, transparent); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
    border-top:1px solid var(--border); box-shadow:0 -8px 22px -14px rgba(16,18,28,.2);
  }
  .view-bar-inner{ max-width:1180px; margin:0 auto; padding:10px 20px; display:flex; gap:8px; justify-content:center; }
  .view-btn{
    appearance:none; border:1px solid transparent; background:transparent; color:var(--ink-2);
    display:flex; align-items:center; gap:7px; padding:9px 20px; border-radius:var(--r-md); font-size:.84rem; font-weight:700; cursor:pointer;
    transition:background .12s ease, color .12s ease;
  }
  .view-btn svg{ width:18px; height:18px; flex:none; }
  .view-btn:hover{ background:var(--surface-2); color:var(--ink); }
  .view-btn.active{ background:var(--accent-soft); color:var(--accent-ink); }
  .view-count{
    font-size:.68rem; font-weight:800; background:var(--surface-2); color:var(--ink-2); border-radius:99px; padding:1px 7px;
  }
  .view-btn.active .view-count{ background:rgba(255,255,255,.55); color:var(--accent-strong); }
  @media (max-width:480px){ .view-btn span:not(.view-count){ display:none; } .view-btn{ padding:10px 16px; } }

  /* ---------- print / export ---------- */
  .print-only{ display:none; }
  .print-title{ font-size:1.5rem; margin-bottom:2px; }
  .print-meta{ font-size:.86rem; color:#444; margin-bottom:18px; }
  .print-section{ margin-top:22px; }
  .print-section h3{ font-size:1.02rem; border-bottom:1.5px solid #ccc; padding-bottom:5px; margin-bottom:10px; }
  .print-day{ margin-bottom:10px; }
  .print-day-head{ font-weight:800; font-size:.82rem; text-transform:uppercase; letter-spacing:.04em; margin-bottom:4px; }
  .print-stop{ display:flex; gap:10px; font-size:.86rem; padding:3px 0; }
  .print-stop .t{ font-family:monospace; width:48px; flex:none; color:#444; }
  .print-table{ width:100%; border-collapse:collapse; font-size:.84rem; }
  .print-table th, .print-table td{ text-align:left; padding:5px 8px; border-bottom:1px solid #ddd; }
  .print-check{ font-size:.86rem; padding:2px 0; }
  @media print{
    .topbar, .shell aside, #view-bar, #notice-host, #modal-host, .trip-actions, .tabs, .add-form, .budget-editrow, .row-actions, .reminder-banner{
      display:none !important;
    }
    .shell{ display:none !important; }
    .print-only{ display:block; max-width:720px; margin:0 auto; color:#111; }
  }
  .topbar{
    position:sticky; top:env(safe-area-inset-top,0px); z-index:20;
    background:color-mix(in srgb, var(--paper) 88%, transparent); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
    border-bottom:1px solid var(--border);
  }
  .topbar-inner{
    max-width:1180px; margin:0 auto; padding-inline:20px; padding-block:14px;
    display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap;
  }
  .brand{ display:flex; align-items:center; gap:12px; }
  .brand-mark-tile{
    width:40px; height:40px; flex:none; border-radius:12px; display:flex; align-items:center; justify-content:center;
    background:linear-gradient(155deg, var(--accent), var(--plum)); box-shadow:0 6px 16px -6px rgba(91,79,240,.55);
  }
  .brand-mark{ width:22px; height:22px; color:#fff; }
  .brand-text h1{ font-size:1.4rem; letter-spacing:-.02em; }
  .brand-text p{ margin:1px 0 0; font-size:.78rem; color:var(--muted); font-weight:500; }
  .btn{
    appearance:none; border:1px solid var(--border-strong); background:var(--surface); color:var(--ink);
    padding:10px 18px; border-radius:var(--r-md); font-size:.86rem; font-weight:700; cursor:pointer;
    display:inline-flex; align-items:center; gap:8px; transition:transform .12s ease, box-shadow .12s ease, border-color .12s ease, background .12s ease;
  }
  .btn:hover{ border-color:var(--accent); transform:translateY(-1px); box-shadow:var(--shadow); }
  .btn:active{ transform:translateY(0); }
  .btn-primary{ background:var(--accent); border-color:var(--accent); color:#fff; box-shadow:0 6px 16px -6px rgba(91,79,240,.5); }
  .btn-primary:hover{ background:var(--accent-strong); border-color:var(--accent-strong); box-shadow:0 10px 22px -8px rgba(91,79,240,.6); }
  .btn-ghost{ background:transparent; border-color:transparent; color:var(--ink-2); }
  .btn-ghost:hover{ border-color:var(--border-strong); background:var(--surface-2); transform:none; box-shadow:none; }
  .btn-danger{ background:transparent; border-color:var(--critical); color:var(--critical); }
  .btn-danger:hover{ background:var(--critical); color:#fff; }
  .btn-sm{ padding:7px 13px; font-size:.78rem; border-radius:var(--r-sm); }
  .btn[disabled]{ opacity:.5; cursor:not-allowed; }

  .notice{
    max-width:1180px; margin:14px auto 0; padding:11px 20px; display:flex; align-items:center; justify-content:space-between; gap:12px;
    background:var(--accent-soft); color:var(--accent-ink); border:1px solid var(--border); border-radius:var(--r-md); font-size:.82rem; font-weight:500;
  }
  .notice button{ background:none; border:none; color:inherit; font-weight:700; cursor:pointer; font-size:.9rem; }

  /* ---------- two column layout ---------- */
  .layout{ display:grid; grid-template-columns:300px 1fr; gap:22px; margin-top:24px; align-items:start; }
  @media (max-width:820px){ .layout{ grid-template-columns:1fr; } }

  /* ---------- trip rail ---------- */
  .rail-head{ display:flex; align-items:baseline; justify-content:space-between; margin-bottom:10px; }
  .rail-head h2{ font-size:.72rem; text-transform:uppercase; letter-spacing:.09em; color:var(--muted); font-family:inherit; font-weight:800; }
  .rail-count{ font-size:.72rem; color:var(--muted); font-weight:600; }
  .trip-list{ display:flex; flex-direction:column; gap:10px; }

  .rail-tools{ margin-bottom:12px; display:flex; flex-direction:column; gap:8px; }
  .search-field{ position:relative; }
  .search-field svg{ position:absolute; left:11px; top:50%; transform:translateY(-50%); width:14px; height:14px; color:var(--muted); pointer-events:none; }
  .search-field input{
    width:100%; background:var(--surface); border:1.5px solid var(--border); border-radius:99px; padding:8px 12px 8px 32px;
    font-size:.82rem; color:var(--ink); transition:border-color .12s ease, box-shadow .12s ease;
  }
  .search-field input:focus{ outline:none; border-color:var(--accent); box-shadow:0 0 0 4px var(--accent-soft); }
  .filter-pills{ display:flex; gap:6px; flex-wrap:wrap; }
  .filter-pill{
    appearance:none; border:1.5px solid var(--border-strong); background:var(--surface); color:var(--ink-2);
    padding:5px 11px; border-radius:99px; font-size:.72rem; font-weight:700; cursor:pointer; transition:all .12s ease;
  }
  .filter-pill.active{ border-color:var(--accent); background:var(--accent); color:#fff; }
  .filter-pill:not(.active):hover{ border-color:var(--accent); }
  .list-empty-filtered{ text-align:center; color:var(--muted); font-size:.82rem; padding:20px 10px; }

  .ticket{
    position:relative; text-align:left; width:100%; border:1px solid var(--border); background:var(--surface);
    border-radius:var(--r-lg); padding:15px 16px; cursor:pointer; box-shadow:var(--shadow); overflow:hidden;
    display:flex; flex-direction:column; gap:9px; transition:transform .14s ease, box-shadow .14s ease, border-color .14s ease;
  }
  .ticket:hover{ border-color:var(--border-strong); transform:translateY(-2px); box-shadow:var(--shadow-lg); }
  .ticket.active{ border-color:var(--accent); background:var(--accent-soft); box-shadow:var(--shadow-lg); }
  .ticket-row1{ display:flex; align-items:flex-start; justify-content:space-between; gap:8px; }
  .ticket-name{ font-size:1rem; font-weight:700; line-height:1.25; font-family:"Bricolage Grotesque","Manrope",sans-serif; }
  .dot{ width:9px; height:9px; border-radius:50%; flex:none; display:inline-block; }
  .cat-svago{ background:var(--teal); } .cat-lavoro{ background:var(--accent); } .cat-altro{ background:var(--plum); }
  .ticket-dest{ font-size:.8rem; color:var(--ink-2); font-weight:500; }
  .ticket-row2{ display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .ticket-dates{ font-size:.72rem; color:var(--muted); }
  .chip{
    font-size:.66rem; font-weight:800; text-transform:uppercase; letter-spacing:.05em;
    padding:4px 9px; border-radius:99px; white-space:nowrap;
  }
  .chip-futuro{ background:var(--accent-soft); color:var(--accent-ink); }
  .chip-corso{ background:color-mix(in srgb, var(--good) 16%, transparent); color:var(--good); }
  .chip-concluso{ background:var(--surface-2); color:var(--muted); }
  .example-badge{ font-size:.62rem; font-weight:700; letter-spacing:.06em; color:var(--accent-ink); background:var(--accent-soft); border-radius:5px; padding:2px 6px; align-self:flex-start; }

  .rail-empty, .empty-state{
    border:1px dashed var(--border-strong); border-radius:var(--r-lg); padding:28px 18px; text-align:center; color:var(--ink-2);
    background:var(--surface); display:flex; flex-direction:column; align-items:center; gap:10px;
  }
  .rail-empty svg, .empty-state svg{ width:34px; height:34px; color:var(--accent); }
  .rail-empty p, .empty-state p{ margin:0; font-size:.85rem; }

  /* ---------- dossier (main) ---------- */
  .dossier{ min-width:0; }
  .dossier-empty{ min-height:420px; display:flex; align-items:center; justify-content:center; }
  .dossier-empty .empty-state{ max-width:340px; padding:44px 28px; }
  .dossier-empty h3{ font-size:1.25rem; }

  /* ---------- home dashboard ---------- */
  .home-greet{ font-size:1.7rem; margin-bottom:4px; }
  .home-sub{ color:var(--ink-2); font-size:.9rem; margin-bottom:20px; }
  .home-section-title{ font-size:.72rem; text-transform:uppercase; letter-spacing:.09em; color:var(--muted); font-weight:800; margin:24px 0 10px; }
  .spotlight{
    background:linear-gradient(135deg, var(--accent), var(--plum)); border-radius:var(--r-xl); padding:26px 28px; color:#fff;
    box-shadow:var(--shadow-lg); display:flex; justify-content:space-between; align-items:flex-end; gap:18px; flex-wrap:wrap;
  }
  .spotlight-eyebrow{ font-size:.7rem; text-transform:uppercase; letter-spacing:.09em; font-weight:800; opacity:.85; }
  .spotlight-name{ font-size:1.6rem; color:#fff; margin-top:6px; }
  .spotlight-meta{ margin-top:6px; font-size:.86rem; opacity:.9; }
  .spotlight-count{ font-family:"Bricolage Grotesque","Manrope",sans-serif; font-size:2.6rem; font-weight:700; letter-spacing:-.02em; line-height:1; }
  .spotlight-count-label{ font-size:.74rem; opacity:.85; margin-top:2px; text-align:right; }
  .spotlight .btn-primary{ background:#fff; border-color:#fff; color:var(--accent-strong); box-shadow:none; }
  .spotlight .btn-primary:hover{ background:#fff; opacity:.9; }
  .ongoing-list{ display:flex; flex-direction:column; gap:10px; }
  .ongoing-card{
    display:flex; align-items:center; justify-content:space-between; gap:12px; background:var(--surface); border:1px solid var(--border);
    border-radius:var(--r-lg); padding:14px 18px; box-shadow:var(--shadow); cursor:pointer; transition:transform .12s ease, box-shadow .12s ease;
  }
  .ongoing-card:hover{ transform:translateY(-2px); box-shadow:var(--shadow-lg); }
  .backup-row{
    display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap;
    background:var(--surface); border:1px solid var(--border); border-radius:var(--r-lg); padding:16px 18px; box-shadow:var(--shadow);
  }
  .ongoing-card .ticket-name{ font-size:1.02rem; }

  .feature-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:12px; }
  @media (max-width:860px){ .feature-grid{ grid-template-columns:repeat(2,1fr); } }
  @media (max-width:560px){ .feature-grid{ grid-template-columns:1fr; } }
  .feature-card{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--r-lg); padding:18px;
    display:flex; flex-direction:column; gap:10px;
  }
  .feature-icon{
    width:38px; height:38px; border-radius:var(--r-sm); display:flex; align-items:center; justify-content:center; flex:none;
  }
  .feature-icon svg{ width:19px; height:19px; }
  .feature-card h4{ font-size:.96rem; margin:0; }
  .feature-card p{ margin:0; font-size:.82rem; color:var(--ink-2); line-height:1.45; }
  .home-hero{
    display:flex; align-items:center; gap:16px; margin-bottom:22px; padding-bottom:22px; border-bottom:1px solid var(--border);
  }
  .home-hero-mark{
    width:52px; height:52px; border-radius:var(--r-lg); flex:none; display:flex; align-items:center; justify-content:center;
    background:linear-gradient(155deg, var(--accent), var(--plum)); box-shadow:0 6px 16px -6px rgba(91,79,240,.5);
  }
  .home-hero-mark svg{ width:27px; height:27px; color:#fff; }

  .trip-header{ background:var(--surface); border:1px solid var(--border); border-radius:var(--r-xl); padding:24px 26px; box-shadow:var(--shadow); }
  .trip-header-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:16px; flex-wrap:wrap; }
  .trip-header h2.trip-title{ font-size:1.85rem; }
  .trip-meta{ margin-top:8px; display:flex; flex-wrap:wrap; gap:8px 16px; align-items:center; color:var(--ink-2); font-size:.86rem; font-weight:500; }
  .trip-meta .mono{ color:var(--ink-2); }
  .trip-actions{ display:flex; gap:8px; }
  .countdown{ margin-top:14px; font-size:.84rem; font-weight:700; color:var(--accent-ink); background:var(--accent-soft); display:inline-flex; padding:7px 13px; border-radius:99px; gap:8px; align-items:center; }
  .trip-notes{ margin-top:12px; font-size:.86rem; color:var(--ink-2); white-space:pre-wrap; }

  .stat-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-top:16px; }
  @media (max-width:680px){ .stat-grid{ grid-template-columns:repeat(2,1fr); } }
  .stat-tile{ background:var(--surface); border:1px solid var(--border); border-radius:var(--r-lg); padding:14px 16px; box-shadow:var(--shadow); }
  .stat-label{ font-size:.68rem; text-transform:uppercase; letter-spacing:.07em; color:var(--muted); font-weight:800; }
  .stat-value{ margin-top:6px; font-family:"Bricolage Grotesque","Manrope",sans-serif; font-size:1.5rem; font-weight:700; letter-spacing:-.02em; }
  .stat-sub{ margin-top:2px; font-size:.74rem; color:var(--ink-2); font-weight:600; }

  .tabs{ display:inline-flex; gap:2px; margin-top:22px; padding:4px; background:var(--surface-2); border-radius:99px; max-width:100%; overflow-x:auto; }
  .tab{
    appearance:none; background:none; border:none; padding:9px 16px; font-size:.82rem; font-weight:700; color:var(--ink-2);
    cursor:pointer; border-radius:99px; white-space:nowrap; transition:background .12s ease, color .12s ease;
  }
  .tab.active{ color:#fff; background:var(--accent); box-shadow:0 4px 12px -4px rgba(91,79,240,.5); }
  .tab:not(.active):hover{ color:var(--ink); background:var(--surface); }
  .tab-warn{ display:inline-block; width:7px; height:7px; border-radius:50%; background:var(--warning); margin-left:5px; vertical-align:middle; }
  .tab.active .tab-warn{ background:#fff; }
  .reminder-banner{
    display:flex; align-items:flex-start; gap:10px; background:color-mix(in srgb, var(--warning) 14%, transparent);
    border:1px solid color-mix(in srgb, var(--warning) 35%, transparent); border-radius:var(--r-lg); padding:13px 15px; margin-bottom:14px;
  }
  .reminder-banner svg{ width:18px; height:18px; flex:none; color:var(--warning); margin-top:1px; }
  .reminder-banner p{ margin:0; font-size:.84rem; color:var(--ink); line-height:1.4; }
  .reminder-banner strong{ font-weight:800; }
  .panel{ padding-top:20px; }

  .card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--r-lg); padding:18px 20px; box-shadow:var(--shadow); }
  .section-title{ font-size:.7rem; text-transform:uppercase; letter-spacing:.09em; color:var(--muted); font-weight:800; margin-bottom:12px; }

  /* forms */
  .field{ display:flex; flex-direction:column; gap:6px; }
  .field label{ font-size:.72rem; font-weight:700; color:var(--ink-2); text-transform:uppercase; letter-spacing:.04em; }
  .field input, .field select, .field textarea{
    background:var(--surface-2); border:1.5px solid transparent; border-radius:var(--r-sm); padding:9px 11px; color:var(--ink); transition:border-color .12s ease, box-shadow .12s ease;
  }
  .field textarea{ resize:vertical; min-height:60px; }
  .field input:focus, .field select:focus, .field textarea:focus{ outline:none; border-color:var(--accent); box-shadow:0 0 0 4px var(--accent-soft); }
  .form-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:12px; }
  .form-actions{ display:flex; justify-content:flex-end; gap:8px; margin-top:16px; }

  .radio-chip input:focus-visible + span{ outline:2px solid var(--accent); outline-offset:2px; }

  .stop-body{ flex:1; min-width:0; }
  .stop-title{ font-weight:700; font-size:.9rem; }
  .stop-note{ font-size:.8rem; color:var(--muted); margin-top:2px; }
  .row-actions{ flex:none; display:flex; gap:6px; align-items:flex-start; }
  .icon-btn{ background:none; border:none; color:var(--muted); cursor:pointer; padding:5px; border-radius:8px; display:flex; }

  .booking{ border:1px solid var(--border); border-radius:var(--r-lg); padding:15px 17px; display:flex; gap:14px; align-items:flex-start; background:var(--surface); box-shadow:var(--shadow); }

  .booking-note a{ color:var(--accent-ink); font-weight:700; text-decoration:none; }

  .empty-row{ color:var(--muted); font-size:.84rem; padding:10px 2px; }

  .participant-list{ display:flex; flex-direction:column; }
  .participant-row{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:8px 0; font-size:.88rem; font-weight:600; border-bottom:1px solid var(--border); }
  .participant-row:last-child{ border-bottom:none; }
  .inline-add-form{ display:flex; gap:8px; margin-top:12px; }
  .inline-add-form input{
    flex:1; appearance:none; border:1px solid var(--border-strong); background:var(--surface); color:var(--ink);

  .balance-list{ display:flex; flex-direction:column; }
  .balance-row{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:7px 0; font-size:.86rem; font-weight:600; border-bottom:1px solid var(--border); }
  .balance-row:last-child{ border-bottom:none; }

  .split-checks{ display:flex; flex-wrap:wrap; gap:10px 16px; margin-top:6px; }
  .split-check{ display:flex; align-items:center; gap:6px; font-size:.84rem; font-weight:600; color:var(--ink-2); cursor:pointer; }
  .split-check input{ accent-color:var(--accent); }

  .confirm-row{ display:flex; gap:8px; align-items:center; }

  @media (max-width:480px){
    .form-grid{ grid-template-columns:1fr; }

  /* ---------------- persistence ---------------- */
  var LOCAL_KEY = 'bussola-trips-v1';
  function persistLocal(){
    try { localStorage.setItem(LOCAL_KEY, JSON.stringify({ trips: state.trips })); }
    catch(e){ console.warn('Salvataggio locale non riuscito', e); }
  }
  function loadLocal(){
    try {
      var raw = localStorage.getItem(LOCAL_KEY);
      if (!raw) return [];
      var parsed = JSON.parse(raw);
      return Array.isArray(parsed.trips) ? parsed.trips : [];
    } catch(e){ return []; }
  }

  function queueSave(trip){
    if (state.storageMode==='local'){ persistLocal(); return Promise.resolve(); }
    var chain = saveChains[trip.id] || Promise.resolve();
    saveChains[trip.id] = chain.then(function(){
      if (!db) return Promise.resolve();
      return tripsCol.doc(trip.id).set(trip).catch(function(err){
        console.warn('Salvataggio non riuscito', err);
      });
    });
    return saveChains[trip.id];
  }

  function findTrip(id){
    for (var i=0;i<state.trips.length;i++) if (state.trips[i].id===id) return state.trips[i];
    return null;
  }

  function mutateTrip(id, fn){
    var trip = findTrip(id);
    if (!trip) return;
    fn(trip);
    if (!db){ render(); }
    queueSave(trip);
    if (!db) return;
    render();
  }

  function addTrip(trip){
    state.trips.push(trip);
    state.activeTripId = trip.id;
    state.activeTab = 'itinerario';
    // A leftover search/filter could hide the trip we just created from the
    // list, even though it's now open on the right — always show it.
    state.search = '';
    state.filterStatus = 'tutti';
    render();
    queueSave(trip);
  }

  function deleteTrip(id){
    state.trips = state.trips.filter(function(t){ return t.id!==id; });
    if (state.activeTripId===id) state.activeTripId = null;
    state.confirmDeleteTrip = null;
    render();
    if (state.storageMode==='local'){ persistLocal(); return; }
    if (db){
      tripsCol.doc(id).delete().catch(function(err){ console.warn('Eliminazione non riuscita', err); });
    }
  }

  function cloneTrip(t){
    function cloneList(list){
      return (list||[]).map(function(it){ var c = Object.assign({}, it); c.id = uid(); return c; });
    }
    var participantMap = {};
    var newParticipants = (t.participants||[]).map(function(p){
      var np = Object.assign({}, p); np.id = uid(); participantMap[p.id] = np.id; return np;
    });
    var newExpenses = (t.expenses||[]).map(function(e){
      var c = Object.assign({}, e); c.id = uid();
      c.paidBy = (e.paidBy && participantMap[e.paidBy]) ? participantMap[e.paidBy] : '';
      c.splitWith = (Array.isArray(e.splitWith) ? e.splitWith : []).map(function(id){ return participantMap[id]; }).filter(Boolean);
      return c;
    });
    return {
      id: uid(), isExample:false, name: t.name + ' (copia)', category:t.category, destination:t.destination,
      startDate:t.startDate, endDate:t.endDate, currency:t.currency||'EUR',
      budgetPlanned:t.budgetPlanned||0, notes:t.notes||'',
      itinerary: cloneList(t.itinerary), expenses: newExpenses,
      checklist: cloneList(t.checklist), bookings: cloneList(t.bookings),
      relocation: Object.assign(defaultRelocation(), t.relocation||{}),
      participants: newParticipants,
      completed:false, forcedOngoing:false, createdAt: new Date().toISOString()
    };
  }

  function tripMatchesSearch(t, q){
    if (t.name.toLowerCase().indexOf(q)!==-1) return true;
    if (t.destination.toLowerCase().indexOf(q)!==-1) return true;
    if ((t.notes||'').toLowerCase().indexOf(q)!==-1) return true;
    if ((t.checklist||[]).some(function(c){ return (c.text||'').toLowerCase().indexOf(q)!==-1; })) return true;
    if ((t.bookings||[]).some(function(b){
      return (b.title||'').toLowerCase().indexOf(q)!==-1 ||
        (b.provider||'').toLowerCase().indexOf(q)!==-1 ||
        (b.reference||'').toLowerCase().indexOf(q)!==-1;
    })) return true;
    if ((t.itinerary||[]).some(function(s){ return (s.title||'').toLowerCase().indexOf(q)!==-1 || (s.note||'').toLowerCase().indexOf(q)!==-1; })) return true;
    return false;
  }

  function filteredTrips(){
    var q = state.search.trim().toLowerCase();
    return state.trips.filter(function(t){
      if (state.filterStatus!=='tutti' && tripStatus(t)!==state.filterStatus) return false;
      if (q && !tripMatchesSearch(t, q)) return false;
      return true;
    }).sort(function(a,b){ return (a.startDate||'').localeCompare(b.startDate||''); });
  }

  function renderTripList(){
    var list = document.getElementById('trip-list');
    var count = document.getElementById('rail-count');
    var total = state.trips.length;
    var sorted = filteredTrips();
    var filtering = state.filterStatus!=='tutti' || state.search.trim();

    if (!total){
      count.textContent = '';
      list.innerHTML = '<div class="rail-empty">' + railEmptySvg() +
        '<p>Nessun viaggio ancora.</p></div>';
      return;
    }

    count.textContent = filtering ? (sorted.length + ' di ' + total) : (total + (total===1?' viaggio':' viaggi'));

    if (!sorted.length){
      list.innerHTML = '<div class="list-empty-filtered">Nessun viaggio corrisponde alla ricerca.</div>';
      return;
    }

    list.innerHTML = sorted.map(function(t){
      var status = tripStatus(t);
      var chipClass = status==='futuro' ? 'chip-futuro' : (status==='corso' ? 'chip-corso' : 'chip-concluso');
      var chipText = status==='futuro' ? 'In arrivo' : (status==='corso' ? 'In corso' : 'Concluso');
      var active = t.id===state.activeTripId ? ' active' : '';
      return (
        '<button class="ticket' + active + '" data-action="select-trip" data-id="' + t.id + '">' +
          (t.isExample ? '<span class="example-badge mono">ESEMPIO</span>' : '') +
          '<div class="ticket-row1">' +
            '<span class="ticket-name display">' + esc(t.name) + '</span>' +
          '</div>' +
          '<div class="ticket-dest"><span class="dot cat-' + t.category + '"></span> &nbsp;' + esc(t.destination) + '</div>' +
          '<div class="ticket-row2">' +
            '<span class="ticket-dates mono">' + fmtDateShort(t.startDate) + ' – ' + fmtDateShort(t.endDate) + '</span>' +
            '<span class="chip ' + chipClass + '">' + chipText + '</span>' +
          '</div>' +
        '</button>'
      );
    }).join('');
  }

      : '<svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="8.3" stroke="currentColor" stroke-width="1.6"/><path d="M8.2 12.3l2.5 2.5 5-5.2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>';

    var html = '<div class="home-section-title" style="margin-top:0;">' + title + '</div>';
    if (!trips.length){
      html += '<div class="dossier-empty" style="min-height:300px;"><div class="empty-state">' + emptySvg +
        '<h3 class="display">' + emptyTitle + '</h3>' +
        '<p>' + emptyMsg + '</p>' +
        (state.trips.length ? '' : '<button class="btn btn-primary btn-sm" style="margin-top:6px;" data-action="open-new-trip">Crea il tuo primo viaggio</button>') +
        '</div></div>';
    } else {
      html += '<div class="ongoing-list">' +
        trips.map(function(t){
          return '<div class="ongoing-card" data-action="select-trip" data-id="' + t.id + '">' +
            '<div><span class="ticket-name display">' + esc(t.name) + '</span>' +
            '<div class="ticket-dest" style="margin-top:4px;"><span class="dot cat-' + t.category + '"></span> &nbsp;' + esc(t.destination) + '</div></div>' +
            '<span class="chip chip-' + status + '">' + (isCorso ? 'In corso' : 'Concluso') + '</span>' +
          '</div>';
        }).join('') +
      '</div>';
    }
    el.innerHTML = html;
  }

  function renderDossier(){
    var el = document.getElementById('dossier');
    var trip = findTrip(state.activeTripId);
    var printHostEl = document.getElementById('print-view');
    if (!trip){
      if (printHostEl) printHostEl.innerHTML = '';
      if (state.filterStatus==='corso' || state.filterStatus==='concluso'){
        renderSectionView(el, state.filterStatus);
        return;
      }
      if (!state.trips.length){
        el.innerHTML = '<div class="dossier-empty"><div class="empty-state">' + dossierEmptySvg() +
          '<h3 class="display">Il tuo prossimo viaggio inizia qui</h3>' +
          '<p>Raccogli in un unico posto itinerario, budget, checklist e prenotazioni — per lo svago, per il lavoro o per qualsiasi altra trasferta.</p>' +
          '<button class="btn btn-primary" data-action="open-new-trip">Crea il tuo primo viaggio</button>' +
          '</div></div>';
        return;
      }
      renderHomeDashboard(el);
      return;
    }
    if (state.activeTab==='trasferimento' && trip.category!=='altro'){ state.activeTab = 'itinerario'; }

    var status = tripStatus(trip);
    var statusText = status==='futuro' ? ('tra ' + Math.max(0,dayDiff(todayStr(), trip.startDate)) + ' giorni')
      : status==='corso' ? ('giorno ' + clamp(dayDiff(trip.startDate, todayStr())+1,1,999) + ' di ' + (dayDiff(trip.startDate,trip.endDate)+1))
      : (trip.completed && todayStr() <= trip.endDate ? 'segnato come completato' : 'concluso il ' + fmtDateLong(trip.endDate));

    var checkDone = trip.checklist.filter(function(c){return c.done;}).length;
    var checkTotal = trip.checklist.length;

    var tripDays = dayDiff(trip.startDate, trip.endDate) + 1;
    var totalSpent = trip.expenses.reduce(function(s,e){ return s + (Number(e.amount)||0); },0);
    var planned = Number(trip.budgetPlanned)||0;
    var pct = planned>0 ? (totalSpent/planned*100) : 0;
    var budgetColor = 'var(--good)';
    if (planned>0 && pct>=100) budgetColor = 'var(--critical)';
    else if (planned>0 && pct>=80) budgetColor = 'var(--warning)';

    var statGrid =
      '<div class="stat-grid">' +
        '<div class="stat-tile"><div class="stat-label">Durata</div><div class="stat-value mono">' + tripDays + '</div><div class="stat-sub">giorn' + (tripDays===1?'o':'i') + ' di viaggio</div></div>' +
        '<div class="stat-tile"><div class="stat-label">Budget</div><div class="stat-value mono" style="color:' + budgetColor + '">' + (planned>0 ? Math.round(pct)+'%' : '—') + '</div><div class="stat-sub">' + fmtMoney(totalSpent, trip.currency) + ' di ' + (planned>0?fmtMoney(planned, trip.currency):'n/d') + '</div></div>' +
        '<div class="stat-tile"><div class="stat-label">Checklist</div><div class="stat-value mono">' + checkDone + '/' + checkTotal + '</div><div class="stat-sub">' + (checkTotal ? Math.round(checkDone/checkTotal*100)+'% completata' : 'nessuna voce') + '</div></div>' +
        '<div class="stat-tile"><div class="stat-label">Prenotazioni</div><div class="stat-value mono">' + trip.bookings.length + '</div><div class="stat-sub">voci salvate</div></div>' +
      '</div>';

    el.innerHTML =
      '<div class="trip-header">' +
        '<div class="trip-header-top">' +
          '<div>' +
            (trip.isExample ? '<span class="example-badge mono" style="margin-bottom:8px;display:inline-block;">ESEMPIO</span>' : '') +
            '<h2 class="trip-title">' + esc(trip.name) + '</h2>' +
            '<div class="trip-meta">' +
              '<span><span class="dot cat-' + trip.category + '"></span> &nbsp;' + CAT_LABEL[trip.category] + '</span>' +
              '<span>' + esc(trip.destination) + '</span>' +
              '<span class="mono">' + fmtDateLong(trip.startDate) + ' → ' + fmtDateLong(trip.endDate) + '</span>' +
            '</div>' +
          '</div>' +
          '<div class="trip-actions">' +
            '<button class="btn btn-ghost btn-sm" data-action="export-trip" data-id="' + trip.id + '">Esporta PDF</button>' +
            '<button class="btn btn-ghost btn-sm" data-action="edit-trip" data-id="' + trip.id + '">Modifica</button>' +
            '<button class="btn btn-ghost btn-sm" data-action="duplicate-trip" data-id="' + trip.id + '">Duplica</button>' +
            (!trip.completed ? '<button class="btn btn-ghost btn-sm" data-action="toggle-ongoing" data-id="' + trip.id + '">' + (trip.forcedOngoing ? 'Rimuovi stato "in corso"' : 'Segna come in corso') + '</button>' : '') +
            '<button class="btn btn-ghost btn-sm" data-action="toggle-complete" data-id="' + trip.id + '">' + (trip.completed ? 'Riapri viaggio' : 'Segna come completato') + '</button>' +
            (state.confirmDeleteTrip===trip.id ?
              '<span class="confirm-row"><button class="btn btn-danger btn-sm" data-action="confirm-delete-trip" data-id="' + trip.id + '">Conferma</button>' +
              '<button class="btn btn-ghost btn-sm" data-action="cancel-delete-trip">Annulla</button></span>' :
              '<button class="btn btn-ghost btn-sm" data-action="ask-delete-trip" data-id="' + trip.id + '">Elimina</button>') +
          '</div>' +
        '</div>' +
        '<div class="countdown">' + statusText + '</div>' +
        (trip.notes ? '<div class="trip-notes">' + esc(trip.notes) + '</div>' : '') +
      '</div>' +

      statGrid +

      '<div class="tabs">' +
        tabBtn('itinerario','Itinerario', trip.itinerary.length) +
        tabBtn('budget','Budget', null) +
        tabBtn('checklist','Checklist', checkDone + '/' + trip.checklist.length, checklistNeedsAttention(trip)) +
        tabBtn('prenotazioni','Prenotazioni', trip.bookings.length) +
        (trip.category==='altro' ? tabBtn('trasferimento','Trasferimento', null) : '') +
      '</div>' +
      '<div class="panel" id="panel">' + renderPanel(trip) + '</div>';

    var printHost = document.getElementById('print-view');
    if (printHost) printHost.innerHTML = renderPrintView(trip);
  }

  function renderPrintView(trip){
    var checkDone = trip.checklist.filter(function(c){return c.done;}).length;
    var totalSpent = trip.expenses.reduce(function(s,e){ return s + (Number(e.amount)||0); },0);
    var planned = Number(trip.budgetPlanned)||0;

    var stops = trip.itinerary.slice().sort(function(a,b){ return (a.date+a.time).localeCompare(b.date+b.time); });
    var groups = {}, order = [];
    stops.forEach(function(s){ if (!groups[s.date]){ groups[s.date]=[]; order.push(s.date); } groups[s.date].push(s); });

    var html = '<h1 class="print-title">' + esc(trip.name) + '</h1>' +
      '<div class="print-meta">' + CAT_LABEL[trip.category] + ' · ' + esc(trip.destination) + ' · ' + fmtDateLong(trip.startDate) + ' → ' + fmtDateLong(trip.endDate) + '</div>' +
      (trip.notes ? '<div class="print-meta">' + esc(trip.notes) + '</div>' : '');

    html += '<div class="print-section"><h3>Itinerario</h3>';
    if (!order.length){ html += '<p>Nessuna tappa in programma.</p>'; }
    else {
      html += order.map(function(date){
        var dayNum = dayDiff(trip.startDate, date) + 1;
        return '<div class="print-day"><div class="print-day-head">Giorno ' + dayNum + ' — ' + fmtDateLong(date) + '</div>' +
          groups[date].map(function(s){
            return '<div class="print-stop"><span class="t">' + esc(s.time||'') + '</span><span>' + esc(s.title) + (s.note ? ' — ' + esc(s.note) : '') + '</span></div>';
          }).join('') +
        '</div>';
      }).join('');
    }
    html += '</div>';

    html += '<div class="print-section"><h3>Budget</h3>' +
      '<p>Speso ' + fmtMoney(totalSpent, trip.currency) + ' di ' + (planned>0?fmtMoney(planned, trip.currency):'budget non impostato') + '</p>';
    if (trip.expenses.length){
      html += '<table class="print-table"><thead><tr><th>Data</th><th>Categoria</th><th>Descrizione</th><th>Importo</th></tr></thead><tbody>' +
        trip.expenses.slice().sort(function(a,b){ return (a.date).localeCompare(b.date); }).map(function(e){
          var catLabel = (EXP_CAT.find(function(c){return c.v===e.category;})||{}).l || e.category;
          return '<tr><td>' + fmtDateShort(e.date) + '</td><td>' + catLabel + '</td><td>' + esc(e.description) + '</td><td>' + fmtMoney(e.amount, trip.currency) + '</td></tr>';
        }).join('') + '</tbody></table>';
    }
    html += '</div>';

    html += '<div class="print-section"><h3>Checklist (' + checkDone + '/' + trip.checklist.length + ')</h3>';
    if (!trip.checklist.length){ html += '<p>Nessuna voce.</p>'; }
    else {
      html += CHK_CAT.map(function(cat){
        var items = trip.checklist.filter(function(c){return c.category===cat.v;});
        if (!items.length) return '';
        return '<div style="margin-bottom:8px;"><strong style="font-size:.82rem;">' + cat.l + '</strong>' +
          items.map(function(it){ return '<div class="print-check">' + (it.done?'☑':'☐') + ' ' + esc(it.text) + '</div>'; }).join('') +
        '</div>';
      }).join('');
    }
    html += '</div>';

    html += '<div class="print-section"><h3>Prenotazioni</h3>';
    if (!trip.bookings.length){ html += '<p>Nessuna prenotazione salvata.</p>'; }
    else {
      html += trip.bookings.map(function(b){
        var typeLabel = (BOOK_TYPE.find(function(x){return x.v===b.type;})||{}).l || b.type;
        return '<div class="print-stop"><span class="t">' + typeLabel + '</span><span>' + esc(b.title) + (b.provider?' — '+esc(b.provider):'') + (b.date?' — '+fmtDateShort(b.date):'') + (b.reference?' — Rif. '+esc(b.reference):'') + '</span></div>';
      }).join('');
    }
    html += '</div>';

    if (trip.category==='altro' && trip.relocation){
      var r = trip.relocation;
      html += '<div class="print-section"><h3>Trasferimento</h3>' +
        '<p>Stipendio ' + fmtMoney(r.salary||0, trip.currency) + ' · Budget di partenza ' + fmtMoney(r.startingBudget||0, trip.currency) + ' · Costo della vita ' + fmtMoney(r.costOfLiving||0, trip.currency) + '</p>' +
        (r.notes ? '<p>' + esc(r.notes) + '</p>' : '') +
      '</div>';
    }

    return html;
  }

  function tabBtn(key,label,badge,warn){
    var active = state.activeTab===key ? ' active' : '';
    var b = (badge!==null && badge!=='') ? (' <span class="mono" style="color:var(--muted);font-weight:500;">(' + badge + ')</span>') : '';
    var w = warn ? ' <span class="tab-warn" title="In scadenza"></span>' : '';
    return '<button class="tab' + active + '" data-action="set-tab" data-tab="' + key + '">' + label + b + w + '</button>';
  }

  // Checklist reminder: true when the trip departs soon and there are still open items.
  function checklistNeedsAttention(trip){
    if (trip.completed) return false;
    var status = tripStatus(trip);
    if (status!=='futuro' && status!=='corso') return false;
    var daysTo = dayDiff(todayStr(), trip.startDate);
    if (status==='futuro' && daysTo>7) return false;
    return trip.checklist.some(function(c){ return !c.done; });
  }

  function renderPanel(trip){
    if (state.activeTab==='itinerario') return panelItinerario(trip);
    if (state.activeTab==='budget') return panelBudget(trip);
    if (state.activeTab==='checklist') return panelChecklist(trip);
    if (state.activeTab==='trasferimento' && trip.category==='altro') return panelTrasferimento(trip);
    return panelPrenotazioni(trip);
  }

  var trashIcon = '<svg viewBox="0 0 24 24" fill="none"><path d="M4 7h16M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2m-9 0 1 13a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-13" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  function delBtn(kind,id){
    var isConfirm = state.confirmDeleteItem && state.confirmDeleteItem.kind===kind && state.confirmDeleteItem.id===id;
    if (isConfirm){
      return '<span class="confirm-row"><button class="btn btn-danger btn-sm" data-action="confirm-delete-item" data-kind="' + kind + '" data-id="' + id + '">Conferma</button>' +
        '<button class="btn btn-ghost btn-sm" data-action="cancel-delete-item">Annulla</button></span>';
    }
    return '<button class="icon-btn" data-action="ask-delete-item" data-kind="' + kind + '" data-id="' + id + '" aria-label="Elimina">' + trashIcon + '</button>';
  }

  /* ---- itinerario ---- */
  function panelItinerario(trip){
    var stops = trip.itinerary.slice().sort(function(a,b){
      return (a.date+a.time).localeCompare(b.date+b.time);
    });
    var groups = {}, order = [];
    stops.forEach(function(s){
      if (!groups[s.date]){ groups[s.date]=[]; order.push(s.date); }
      groups[s.date].push(s);
    });
    var html = '<div class="card">';
    if (!order.length){
      html += '<div class="empty-row">Nessuna tappa in programma. Aggiungine una qui sotto.</div>';
    } else {
      html += order.map(function(date){
        var dayNum = dayDiff(trip.startDate, date) + 1;
        return '<div class="day-group">' +
          '<div class="day-head"><span class="day-num mono">Giorno ' + dayNum + '</span><span class="day-date">' + fmtDateLong(date) + '</span></div>' +
          groups[date].map(function(s){
            return '<div class="stop">' +
              '<div class="stop-time mono">' + esc(s.time||'') + '</div>' +
              '<div class="stop-body"><div class="stop-title">' + esc(s.title) + '</div>' +
              (s.note ? '<div class="stop-note">' + esc(s.note) + '</div>' : '') + '</div>' +
              '<div class="row-actions">' + delBtn('stop', s.id) + '</div>' +
            '</div>';
          }).join('') +
        '</div>';
      }).join('');
    }
    html += '</div>';

    html += '<form class="add-form" data-form="add-stop" data-trip="' + trip.id + '">' +
      '<div class="section-title">Aggiungi tappa</div>' +
      '<div class="form-grid">' +
        field('date','Data','date',{value:trip.startDate, min:trip.startDate, max:trip.endDate, required:true}) +
        field('time','Ora','time',{required:true}) +
        field('title','Cosa','text',{placeholder:'Es. Check-in hotel', required:true}) +
      '</div>' +
      field('note','Note (facoltativo)','text',{placeholder:'Dettagli utili'}) +
      '<div class="form-actions"><button class="btn btn-primary btn-sm" type="submit">Aggiungi tappa</button></div>' +
    '</form>';
    return html;
  }

  /* ---- budget ---- */
  function computeBalances(trip){
    var participants = trip.participants || [];
    var totals = {};
    participants.forEach(function(p){ totals[p.id] = {paid:0, owed:0}; });
    (trip.expenses||[]).forEach(function(e){
      var amount = Number(e.amount)||0;
      if (e.paidBy && totals[e.paidBy]) totals[e.paidBy].paid += amount;
      var split = (Array.isArray(e.splitWith) ? e.splitWith : []).filter(function(id){ return totals[id]; });
      if (split.length){
        var share = amount / split.length;
        split.forEach(function(id){ totals[id].owed += share; });
      }
    });
    return participants.map(function(p){
      var t = totals[p.id] || {paid:0, owed:0};
      return { id:p.id, name:p.name, paid:t.paid, owed:t.owed, balance: t.paid - t.owed };
    });
  }

  function computeSettlements(balances){
    var creditors = balances.filter(function(b){ return b.balance>0.005; })
      .map(function(b){ return {name:b.name, amt:b.balance}; }).sort(function(a,b){ return b.amt-a.amt; });
    var debtors = balances.filter(function(b){ return b.balance<-0.005; })
      .map(function(b){ return {name:b.name, amt:-b.balance}; }).sort(function(a,b){ return b.amt-a.amt; });
    var result = [], i=0, j=0;
    while (i<debtors.length && j<creditors.length){
      var pay = Math.min(debtors[i].amt, creditors[j].amt);
      if (pay>0.005) result.push({from:debtors[i].name, to:creditors[j].name, amount:pay});
      debtors[i].amt -= pay; creditors[j].amt -= pay;
      if (debtors[i].amt<=0.005) i++;
      if (creditors[j].amt<=0.005) j++;
    }
    return result;
  }

  function panelBudget(trip){
    var participants = trip.participants || [];
    var totalSpent = trip.expenses.reduce(function(s,e){ return s + (Number(e.amount)||0); },0);
    var planned = Number(trip.budgetPlanned)||0;
    var pct = planned>0 ? (totalSpent/planned*100) : 0;
    var statusColor = 'var(--good)', statusText = 'nella norma', barColor='var(--accent)';
    if (planned>0 && pct>=100){ statusColor='var(--critical)'; statusText='budget superato'; barColor='var(--critical)'; }
    else if (planned>0 && pct>=80){ statusColor='var(--warning)'; statusText='in avvicinamento al limite'; barColor='var(--warning)'; }

    var byCat = {};
    EXP_CAT.forEach(function(c){ byCat[c.v]=0; });
    trip.expenses.forEach(function(e){ byCat[e.category] = (byCat[e.category]||0) + (Number(e.amount)||0); });
    var maxCat = Math.max.apply(null, EXP_CAT.map(function(c){return byCat[c.v];}).concat([1]));

    var html = '<div class="card">' +
      '<div class="section-title">Riepilogo spese</div>' +
      '<div class="budget-summary">' +
        '<div class="budget-figure">' + fmtMoney(totalSpent, trip.currency) + ' <span class="of">di ' + (planned>0?fmtMoney(planned, trip.currency):'— non impostato') + '</span></div>' +
        '<div class="status-label" style="color:' + statusColor + '"><span class="status-dot" style="background:' + statusColor + '"></span>' + statusText + '</div>' +
      '</div>' +
      '<div class="meter"><div style="width:' + clamp(pct,0,100) + '%;background:' + barColor + ';"></div></div>' +
      '<form class="budget-editrow" data-form="set-budget" data-trip="' + trip.id + '">' +
        '<label for="budgetPlanned">Budget pianificato</label>' +
        '<input type="number" min="0" step="1" id="budgetPlanned" name="budgetPlanned" value="' + (trip.budgetPlanned||'') + '">' +
        '<button class="btn btn-ghost btn-sm" type="submit">Salva</button>' +
      '</form>' +
    '</div>';

    html += '<div class="card" style="margin-top:14px;"><div class="section-title">Partecipanti</div>' +
      (participants.length ? '<div class="participant-list">' +
        participants.map(function(p){
          return '<div class="participant-row"><span>' + esc(p.name) + '</span>' + delBtn('participant', p.id) + '</div>';
        }).join('') +
      '</div>' : '<div class="empty-row">Aggiungi le persone con cui condividi il viaggio per dividere le spese.</div>') +
      '<form class="inline-add-form" data-form="add-participant" data-trip="' + trip.id + '">' +
        '<input type="text" name="name" placeholder="Nome" required>' +
        '<button class="btn btn-ghost btn-sm" type="submit">Aggiungi</button>' +
      '</form>' +
    '</div>';

    if (participants.length>=2){
      var balances = computeBalances(trip);
      var settle = computeSettlements(balances);
      html += '<div class="card" style="margin-top:14px;"><div class="section-title">Saldi tra partecipanti</div><div class="balance-list">' +
        balances.map(function(b){
          var color = b.balance>0.005?'var(--good)':(b.balance<-0.005?'var(--critical)':'var(--muted)');
          var label = b.balance>0.005 ? ('deve ricevere ' + fmtMoney(b.balance, trip.currency))
            : (b.balance<-0.005 ? ('deve dare ' + fmtMoney(-b.balance, trip.currency)) : 'in pari');
          return '<div class="balance-row"><span>' + esc(b.name) + '</span><span class="mono" style="color:' + color + ';font-weight:700;">' + label + '</span></div>';
        }).join('') +
      '</div>' +
      (settle.length ? '<div class="settle-list">' + settle.map(function(s){
        return '<div class="settle-row"><span>' + esc(s.from) + ' <span style="color:var(--muted);">→</span> ' + esc(s.to) + '</span><span class="mono">' + fmtMoney(s.amount, trip.currency) + '</span></div>';
      }).join('') + '</div>' : '') +
      '</div>';
    }

    var catRows = EXP_CAT.map(function(c){ return {l:c.l, v:byCat[c.v]}; }).sort(function(a,b){ return b.v-a.v; });
    html += '<div class="card" style="margin-top:14px;"><div class="section-title">Per categoria</div><div class="cat-breakdown">' +
      catRows.map(function(c){
        var v = c.v;
        var share = totalSpent>0 ? Math.round(v/totalSpent*100) : 0;
        return '<div class="cat-row"><span class="cat-name">' + c.l + '</span>' +
          '<span class="cat-bar-track"><span class="cat-bar-fill" style="width:' + (v/maxCat*100) + '%"></span></span>' +
          '<span class="cat-amt mono">' + fmtMoney(v, trip.currency) + (totalSpent>0 ? ' <span style="color:var(--muted);font-weight:600;">· ' + share + '%</span>' : '') + '</span></div>';
      }).join('') +
    '</div></div>';

    var expensesSorted = trip.expenses.slice().sort(function(a,b){ return (b.date).localeCompare(a.date); });
    html += '<div class="card" style="margin-top:14px;"><div class="section-title">Spese registrate</div>';
    if (!expensesSorted.length){
      html += '<div class="empty-row">Nessuna spesa registrata.</div>';
    } else {
      html += '<div class="table-wrap"><table class="list-table"><thead><tr><th>Data</th><th>Categoria</th><th>Descrizione</th>' +
        (participants.length ? '<th>Pagato da</th>' : '') + '<th>Importo</th><th></th></tr></thead><tbody>' +
        expensesSorted.map(function(e){
          var catLabel = (EXP_CAT.find(function(c){return c.v===e.category;})||{}).l || e.category;
          var payerName = e.paidBy ? ((participants.find(function(p){return p.id===e.paidBy;})||{}).name || '—') : '—';
          return '<tr><td class="mono">' + fmtDateShort(e.date) + '</td><td>' + catLabel + '</td><td>' + esc(e.description) + '</td>' +
            (participants.length ? '<td>' + esc(payerName) + '</td>' : '') +
            '<td class="amt-cell mono">' + fmtMoney(e.amount, trip.currency) + '</td><td>' + delBtn('expense', e.id) + '</td></tr>';
        }).join('') + '</tbody></table></div>';
    }

    html += '<form class="add-form" data-form="add-expense" data-trip="' + trip.id + '">' +
      '<div class="section-title">Aggiungi spesa</div>' +
      '<div class="form-grid">' +
        field('date','Data','date',{value:todayStr(), required:true}) +
        selectField('category','Categoria', EXP_CAT) +
        field('description','Descrizione','text',{placeholder:'Es. Biglietto treno', required:true}) +
        field('amount','Importo (€)','number',{step:'0.01', min:'0', required:true}) +
        (participants.length ? selectField('paidBy','Pagato da', [{v:'',l:'Non specificato'}].concat(participants.map(function(p){return {v:p.id,l:p.name};})), '') : '') +
      '</div>' +
      (participants.length ? '<div class="field"><label>Diviso tra</label><div class="split-checks">' +
        participants.map(function(p){
          return '<label class="split-check"><input type="checkbox" name="splitWith" value="' + p.id + '" checked> ' + esc(p.name) + '</label>';
        }).join('') +
      '</div></div>' : '') +
      '<div class="form-actions"><button class="btn btn-primary btn-sm" type="submit">Aggiungi spesa</button></div>' +
    '</form>';

  /* ---- checklist ---- */
  function panelChecklist(trip){
    var done = trip.checklist.filter(function(c){return c.done;}).length;
    var total = trip.checklist.length;
    var open = total - done;
    var pct = total ? (done/total*100) : 0;
    var html = '';
    if (checklistNeedsAttention(trip)){
      var status = tripStatus(trip);
      var daysTo = dayDiff(todayStr(), trip.startDate);
      var when = status==='corso' ? 'Il viaggio è già in corso' : (daysTo<=0 ? 'Si parte oggi' : 'Si parte tra ' + daysTo + ' giorn' + (daysTo===1?'o':'i'));
      html += '<div class="reminder-banner">' +
        '<svg viewBox="0 0 24 24" fill="none"><path d="M12 9v4.5M12 17h.01" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M10.6 4.3 2.9 18a1.7 1.7 0 0 0 1.5 2.5h15.2a1.7 1.7 0 0 0 1.5-2.5L13.4 4.3a1.7 1.7 0 0 0-2.8 0Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>' +
        '<p>' + when + ' e hai ancora <strong>' + open + (open===1?' voce':' voci') + '</strong> da completare in checklist.</p>' +
      '</div>';
    }
    html += '<div class="card">' +
      '<div class="check-progress"><span class="mono" style="font-size:.82rem;color:var(--ink-2);white-space:nowrap;">' + done + '/' + total + ' completati</span>' +
      '<div class="meter"><div style="width:' + pct + '%;background:var(--accent);"></div></div></div>';

    if (!total){
      html += '<div class="empty-row">Nessuna voce in checklist. Aggiungine una qui sotto.</div>';
    } else {
      html += CHK_CAT.map(function(cat){
        var items = trip.checklist.filter(function(c){return c.category===cat.v;});
        if (!items.length) return '';
        return '<div class="check-group"><div class="section-title">' + cat.l + '</div>' +
          items.map(function(it){
            var cid = 'chk-' + it.id;
            return '<div class="check-item' + (it.done?' done':'') + '">' +
              '<input type="checkbox" id="' + cid + '" data-action="toggle-check" data-trip="' + trip.id + '" data-id="' + it.id + '" ' + (it.done?'checked':'') + '>' +
              '<label for="' + cid + '">' + esc(it.text) + '</label>' +
              delBtn('check', it.id) +
            '</div>';
          }).join('') +
        '</div>';
      }).join('');
    }
    html += '</div>';

    html += '<form class="add-form" data-form="add-check" data-trip="' + trip.id + '">' +
      '<div class="section-title">Aggiungi voce</div>' +
      '<div class="form-grid">' +
        selectField('category','Categoria', CHK_CAT) +
        field('text','Cosa','text',{placeholder:'Es. Passaporto', required:true}) +
      '</div>' +
      '<div class="form-actions"><button class="btn btn-primary btn-sm" type="submit">Aggiungi</button></div>' +
    '</form>';
    return html;
  }

    var html = '<div class="stat-grid" style="margin-top:0;">' +

      '<div class="stat-tile"><div class="stat-label">Margine mensile</div><div class="stat-value mono" style="color:' + marginColor + '">' + (margin>=0?'+':'') + fmtMoney(margin, trip.currency) + '</div><div class="stat-sub">stipendio meno costo della vita</div></div>' +
      '<div class="stat-tile"><div class="stat-label">Autonomia iniziale</div><div class="stat-value mono">' + (runway!==null ? runway.toFixed(1) : '—') + '</div><div class="stat-sub">' + (runway!==null ? 'mesi col budget di partenza' : 'imposta il costo della vita') + '</div></div>' +

        '<div style="display:flex; justify-content:space-between; gap:12px;"><span style="color:var(--ink-2); font-weight:600; font-size:.84rem;">Tipo di contratto</span><span style="font-weight:700;">' + esc(contractLabel) + '</span></div>' +

      '<div class="form-grid">' +
        field('salary','Stipendio netto mensile','number',{value:r.salary||'', step:'0.01', min:'0'}) +
        field('startingBudget','Budget di partenza','number',{value:r.startingBudget||'', step:'0.01', min:'0'}) +
        field('costOfLiving','Costo della vita mensile stimato','number',{value:r.costOfLiving||'', step:'0.01', min:'0'}) +
        selectField('contractType','Tipo di contratto', CONTRACT_TYPES, r.contractType||'') +
      '</div>' +
      '<div class="field" style="margin-top:12px;"><label for="f-relocationNotes">Note sul trasferimento</label>' +
        '<textarea id="f-relocationNotes" name="notes" placeholder="Permessi, scadenze, referenze utili...">' + esc(r.notes||'') + '</textarea></div>' +
      '<div class="form-actions"><button class="btn btn-primary btn-sm" type="submit">Salva dati trasferimento</button></div>' +
    '</form>';

    return html;

  function field(name,label,type,opts){
    opts = opts||{};
    var attrs = Object.keys(opts).map(function(k){
      if (opts[k]===true) return k;
      if (opts[k]===false || opts[k]==null) return '';
      return k + '="' + esc(opts[k]) + '"';
    }).filter(Boolean).join(' ');
    return '<div class="field"><label for="f-' + name + '">' + label + '</label>' +
      '<input type="' + type + '" id="f-' + name + '" name="' + name + '" ' + attrs + '></div>';
  }
  function selectField(name,label,options,selected){
    return '<div class="field"><label for="f-' + name + '">' + label + '</label>' +
      '<select id="f-' + name + '" name="' + name + '">' +
      options.map(function(o){ return '<option value="' + o.v + '"' + (o.v===selected?' selected':'') + '>' + o.l + '</option>'; }).join('') +
      '</select></div>';
  }

  /* ---------------- render: view bar ---------------- */

    host.style.display='block';
    var ongoingCount = state.trips.filter(function(t){ return tripStatus(t)==='corso'; }).length;
    var completedCount = state.trips.filter(function(t){ return tripStatus(t)==='concluso'; }).length;
    var section = state.activeTripId ? null : (state.filterStatus==='corso' ? 'corso' : state.filterStatus==='concluso' ? 'concluso' : 'dashboard');
    var items = [
      { key:'dashboard', label:'Dashboard', count:0,
        svg:'<rect x="3.5" y="3.5" width="7.2" height="7.2" rx="1.6" stroke="currentColor" stroke-width="1.6"/><rect x="13.3" y="3.5" width="7.2" height="7.2" rx="1.6" stroke="currentColor" stroke-width="1.6"/><rect x="3.5" y="13.3" width="7.2" height="7.2" rx="1.6" stroke="currentColor" stroke-width="1.6"/><rect x="13.3" y="13.3" width="7.2" height="7.2" rx="1.6" stroke="currentColor" stroke-width="1.6"/>' },
      { key:'corso', label:'In corso', count:ongoingCount,
        svg:'<circle cx="12" cy="12" r="8.3" stroke="currentColor" stroke-width="1.6" fill="none"/><path d="M12 7.5V12l3.1 1.9" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>' },
      { key:'concluso', label:'Completati', count:completedCount,
        svg:'<circle cx="12" cy="12" r="8.3" stroke="currentColor" stroke-width="1.6" fill="none"/><path d="M8.2 12.3l2.5 2.5 5-5.2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>' }

          '<svg viewBox="0 0 24 24" fill="none">' + it.svg + '</svg>' +
          '<span>' + it.label + '</span>' +

  /* ---------------- master render ---------------- */
  function render(){
    renderNotice();
    renderRailTools();
    renderTripList();
    renderDossier();
    renderModal();
    renderViewBar();
    var topbarBtn = document.getElementById('topbar-new-trip');
    if (topbarBtn) topbarBtn.style.display = state.trips.length ? '' : 'none';
  }

  /* ---------------- events (delegation) ---------------- */
  document.addEventListener('click', function(e){
    var t = e.target.closest('[data-action]');
    if (!t) return;
    var action = t.getAttribute('data-action');

    if (action==='open-new-trip'){ state.modal = {mode:'new'}; renderModal(); return; }
    if (action==='edit-trip'){
      var tr = findTrip(t.getAttribute('data-id'));
      if (tr) { state.modal = {mode:'edit', trip:tr}; renderModal(); }
      return;
    }
    if (action==='close-modal'){
      state.modal = null; renderModal(); return;
    }
    if (action==='dismiss-notice'){ state.noticeDismissed = true; renderNotice(); return; }

    if (action==='select-trip'){
      state.activeTripId = t.getAttribute('data-id');
      state.activeTab = 'itinerario';
      state.confirmDeleteItem = null;
      renderTripList(); renderDossier(); renderViewBar();
      return;
    }
    if (action==='set-filter'){
      state.filterStatus = t.getAttribute('data-filter');
      renderRailTools(); renderTripList(); renderViewBar();
      return;
    }
    if (action==='go-view'){
      var view = t.getAttribute('data-view');
      state.activeTripId = null;
      state.search = '';
      state.filterStatus = view==='dashboard' ? 'tutti' : view;
      state.confirmDeleteTrip = null;
      render();
      return;
    }
    if (action==='duplicate-trip'){
      var toClone = findTrip(t.getAttribute('data-id'));
      if (toClone){ addTrip(cloneTrip(toClone)); }
      return;
    }
    if (action==='export-trip'){
      window.print();
      return;
    }
    if (action==='export-backup'){
      exportBackup();
      return;
    }
    if (action==='import-backup'){
      var fileInput = document.getElementById('backup-file-input');
      if (fileInput) fileInput.click();
      return;
    }
    if (action==='set-tab'){
      state.activeTab = t.getAttribute('data-tab');
      state.confirmDeleteItem = null;
      renderDossier();
      return;
    }

    if (action==='toggle-complete'){
      mutateTrip(t.getAttribute('data-id'), function(tr){
        tr.completed = !tr.completed;
        if (tr.completed) tr.forcedOngoing = false;
      });
      return;
    }
    if (action==='toggle-ongoing'){
      mutateTrip(t.getAttribute('data-id'), function(tr){
        tr.forcedOngoing = !tr.forcedOngoing;
        if (tr.forcedOngoing) tr.completed = false;
      });
      return;
    }
    if (action==='ask-delete-trip'){ state.confirmDeleteTrip = t.getAttribute('data-id'); renderDossier(); return; }
    if (action==='cancel-delete-trip'){ state.confirmDeleteTrip = null; renderDossier(); return; }
    if (action==='confirm-delete-trip'){ deleteTrip(t.getAttribute('data-id')); return; }

    if (action==='ask-delete-item'){
      state.confirmDeleteItem = {kind:t.getAttribute('data-kind'), id:t.getAttribute('data-id')};
      renderDossier();
      return;
    }
    if (action==='cancel-delete-item'){ state.confirmDeleteItem = null; renderDossier(); return; }
    if (action==='confirm-delete-item'){
      var kind = t.getAttribute('data-kind'), id = t.getAttribute('data-id');
      var trip = findTrip(state.activeTripId);
      if (trip){
        var listKey = {stop:'itinerary', expense:'expenses', check:'checklist', booking:'bookings', participant:'participants'}[kind];
        mutateTrip(trip.id, function(tr){
          tr[listKey] = tr[listKey].filter(function(x){ return x.id!==id; });
          if (kind==='participant'){
            (tr.expenses||[]).forEach(function(e){
              if (e.paidBy===id) e.paidBy = '';
              if (Array.isArray(e.splitWith)) e.splitWith = e.splitWith.filter(function(pid){ return pid!==id; });
            });
          }
        });
      }
      state.confirmDeleteItem = null;
      renderDossier();
      return;
    }

    if (action==='toggle-check'){
      var tripId = t.getAttribute('data-trip'), itemId = t.getAttribute('data-id');
      mutateTrip(tripId, function(tr){
        var item = tr.checklist.find(function(c){return c.id===itemId;});
        if (item) item.done = !item.done;
      });
      return;
    }
  });

  document.addEventListener('submit', function(e){
    var form = e.target.closest('form[data-form]');
    if (!form) return;
    e.preventDefault();
    var kind = form.getAttribute('data-form');
    var fd = new FormData(form);

    if (kind==='trip-form'){
      var data = Object.fromEntries(fd.entries());
      if (state.modal.mode==='edit'){
        mutateTrip(state.modal.trip.id, function(tr){
          tr.name = data.name; tr.category = data.category; tr.destination = data.destination;
          tr.startDate = data.startDate; tr.endDate = data.endDate; tr.currency = data.currency||'EUR';
          tr.budgetPlanned = data.budgetPlanned ? Number(data.budgetPlanned) : 0;
          tr.notes = data.notes;
        });
      } else {
        addTrip({
          id: uid(), name:data.name, category:data.category, destination:data.destination,
          startDate:data.startDate, endDate:data.endDate, currency:data.currency||'EUR',
          budgetPlanned: data.budgetPlanned ? Number(data.budgetPlanned) : 0,
          notes:data.notes, itinerary:[], expenses:[], checklist:[], bookings:[], relocation:defaultRelocation(), participants:[],
          completed:false, forcedOngoing:false, createdAt: new Date().toISOString()
        });
      }
      state.modal = null;
      render();
      return;
    }

    var tripId = form.getAttribute('data-trip');
    if (!tripId) return;

    if (kind==='add-stop'){
      var d = Object.fromEntries(fd.entries());
      if (!d.title) return;
      mutateTrip(tripId, function(tr){
        tr.itinerary.push({id:uid(), date:d.date||tr.startDate, time:d.time||'', title:d.title, note:d.note||''});
      });
      form.reset();
      return;
    }
    if (kind==='set-budget'){
      var d2 = Object.fromEntries(fd.entries());
      mutateTrip(tripId, function(tr){ tr.budgetPlanned = d2.budgetPlanned ? Number(d2.budgetPlanned) : 0; });
      return;
    }
    if (kind==='add-expense'){
      var d3 = Object.fromEntries(fd.entries());
      if (!d3.description || !d3.amount) return;
      var splitWith = fd.getAll('splitWith');
      mutateTrip(tripId, function(tr){
        tr.expenses.push({
          id:uid(), date:d3.date||todayStr(), category:d3.category||'altro', description:d3.description, amount:Number(d3.amount)||0,
          paidBy: d3.paidBy||'', splitWith: splitWith
        });
      });
      form.reset();
      return;
    }
    if (kind==='add-participant'){
      var d3b = Object.fromEntries(fd.entries());
      if (!d3b.name || !String(d3b.name).trim()) return;
      mutateTrip(tripId, function(tr){
        tr.participants = tr.participants || [];
        tr.participants.push({id:uid(), name:String(d3b.name).trim()});
      });
      form.reset();
      return;
    }
    if (kind==='add-check'){
      var d4 = Object.fromEntries(fd.entries());
      if (!d4.text) return;
      mutateTrip(tripId, function(tr){
        tr.checklist.push({id:uid(), category:d4.category||'da_fare', text:d4.text, done:false});
      });
      form.reset();
      return;
    }
    if (kind==='add-booking'){
      var d5 = Object.fromEntries(fd.entries());
      if (!d5.title) return;
      mutateTrip(tripId, function(tr){
        tr.bookings.push({id:uid(), type:d5.type||'altro', title:d5.title, provider:d5.provider||'', date:d5.date||'', reference:d5.reference||'', link:d5.link||'', note:d5.note||''});
      });
      form.reset();
      return;
    }
    if (kind==='set-relocation'){
      var d6 = Object.fromEntries(fd.entries());
      mutateTrip(tripId, function(tr){
        tr.relocation = {
          salary: d6.salary ? Number(d6.salary) : 0,
          startingBudget: d6.startingBudget ? Number(d6.startingBudget) : 0,
          costOfLiving: d6.costOfLiving ? Number(d6.costOfLiving) : 0,
          contractType: d6.contractType || '',
          notes: d6.notes || ''
        };
      });
      return;
    }
  });

  document.addEventListener('input', function(e){
    if (e.target && e.target.id==='trip-search'){
      state.search = e.target.value;
      renderTripList();
    }
  });

  document.addEventListener('mousedown', function(e){
    var backdrop = e.target.closest('.modal-backdrop');
    if (backdrop && e.target===backdrop){ state.modal = null; renderModal(); }
  });
  document.addEventListener('keydown', function(e){
    if (e.key==='Escape' && state.modal){ state.modal=null; renderModal(); }
  });

  /* ---------------- backup: export / import ---------------- */
  function backupStatus(msg, isError){
    var el = document.getElementById('backup-status');
    if (!el) return;
    el.textContent = msg;
    el.style.color = isError ? 'var(--critical)' : 'var(--good)';
  }

  function exportBackup(){
    var payload = {
      app: 'bussola', version: 1, exportedAt: new Date().toISOString(),
      trips: state.trips
    };
    var json = JSON.stringify(payload, null, 2);
    var filename = 'bussola-backup-' + todayStr() + '.json';

    if (downloadsCap){
      downloadsCap.save({ filename: filename, data: json })
        .then(function(){
          backupStatus('Backup scaricato (' + state.trips.length + (state.trips.length===1?' viaggio':' viaggi') + ').', false);
        })
        .catch(function(err){
          var msg = (err && err.code==='declined') ? 'Download annullato.' : 'Non è stato possibile scaricare il backup.';
          backupStatus(msg, true);
        });
      return;
    }

    // Outside the Claude artifact viewer (standalone PWA / self-hosted page)
    // a normal browser download works fine.
    if (typeof Blob==='function' && typeof URL!=='undefined' && URL.createObjectURL){
      try {
        var blob = new Blob([json], {type:'application/json'});
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url; a.download = filename;
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
        backupStatus('Backup scaricato (' + state.trips.length + (state.trips.length===1?' viaggio':' viaggi') + ').', false);
        return;
      } catch(e){ /* fall through */ }
    }
    backupStatus('Il download non è disponibile in questa visualizzazione.', true);
  }

  function sanitizeImportedTrip(raw){
    function cloneList(list){
      return (Array.isArray(list)?list:[]).map(function(it){
        var c = Object.assign({}, it); c.id = uid(); return c;
      });
    }
    if (!raw || typeof raw!=='object' || !raw.name || !raw.startDate || !raw.endDate) return null;
    var participantMap = {};
    var participants = (Array.isArray(raw.participants)?raw.participants:[]).map(function(p){
      var np = Object.assign({}, p); np.id = uid(); if (p && p.id) participantMap[p.id] = np.id; return np;
    });
    var expenses = (Array.isArray(raw.expenses)?raw.expenses:[]).map(function(e){
      var c = Object.assign({}, e); c.id = uid();
      c.paidBy = (e.paidBy && participantMap[e.paidBy]) ? participantMap[e.paidBy] : '';
      c.splitWith = (Array.isArray(e.splitWith)?e.splitWith:[]).map(function(id){ return participantMap[id]; }).filter(Boolean);
      return c;
    });
    return {
      id: uid(), isExample:false, name:String(raw.name), category: raw.category||'svago',
      destination: String(raw.destination||''), startDate: raw.startDate, endDate: raw.endDate,
      currency: raw.currency||'EUR', budgetPlanned: Number(raw.budgetPlanned)||0, notes: raw.notes||'',
      itinerary: cloneList(raw.itinerary), expenses: expenses,
      checklist: cloneList(raw.checklist), bookings: cloneList(raw.bookings),
      relocation: Object.assign(defaultRelocation(), raw.relocation||{}),
      participants: participants,
      completed: !!raw.completed, forcedOngoing: !!raw.forcedOngoing,
      createdAt: new Date().toISOString()
    };
  }

  function importBackupFile(file){
    var reader = new FileReader();
    reader.onload = function(){
      var imported;
      try { imported = JSON.parse(String(reader.result)); }
      catch(e){ backupStatus('File non valido: non è un backup Bussola leggibile.', true); return; }
      var rawTrips = Array.isArray(imported) ? imported : (Array.isArray(imported && imported.trips) ? imported.trips : null);
      if (!rawTrips){ backupStatus('File non valido: non è un backup Bussola leggibile.', true); return; }
      var added = 0;
      rawTrips.forEach(function(raw){
        var trip = sanitizeImportedTrip(raw);
        if (trip){ state.trips.push(trip); queueSave(trip); added++; }
      });
      if (!added){ backupStatus('Nessun viaggio valido trovato in questo file.', true); return; }
      state.search = ''; state.filterStatus = 'tutti'; state.activeTripId = null;
      render();
      backupStatus(added===1 ? 'Importato 1 viaggio.' : 'Importati ' + added + ' viaggi.', false);
    };
    reader.readAsText(file);
  }

  var backupFileInput = document.getElementById('backup-file-input');
  if (backupFileInput){
    backupFileInput.addEventListener('change', function(){
      var file = backupFileInput.files && backupFileInput.files[0];
      if (file) importBackupFile(file);
      backupFileInput.value = '';
    });
  }

  /* ---------------- boot ---------------- */
  function tryLocalStorageFallback(){
    var supported = false;
    try {
      var testKey = '__bussola_test__';
      localStorage.setItem(testKey, '1');
      localStorage.removeItem(testKey);
      supported = true;
    } catch(e){ supported = false; }

    if (supported){
      state.storageMode = 'local';
      state.dbAvailable = false;
      state.trips = loadLocal();
    } else {
      state.storageMode = 'none';
      state.dbAvailable = false;
      state.trips = exampleTrips();
    }
    render();
  }

  function boot(){
    render();
    if (!window.claude || !window.claude.use){
      tryLocalStorageFallback();
      return;
    }
    window.claude.use('downloads').then(function(ns){ downloadsCap = ns; }).catch(function(){ downloadsCap = null; });
    window.claude.use('db').then(function(ns){
      if (!ns){
        tryLocalStorageFallback();
        return;
      }
      db = ns;
      state.dbAvailable = true;
      state.storageMode = 'cloud';
      tripsCol = db.collection('trips');

      tripsCol.onSnapshot(function(snap){
        state.trips = snap.docs.map(function(d){
          var data = d.data() || {};
          data.id = d.id;
          data.itinerary = data.itinerary || [];
          data.expenses = data.expenses || [];
          data.checklist = data.checklist || [];
          data.bookings = data.bookings || [];
          data.participants = data.participants || [];
          data.relocation = Object.assign(defaultRelocation(), data.relocation||{});
          data.completed = !!data.completed;
          data.forcedOngoing = !!data.forcedOngoing;
          return data;
        });
        render();
      }, function(err){
        console.warn('Sincronizzazione non disponibile', err);
      });

      // Example trips are no longer auto-created: the list starts empty so
      // only trips the person actually adds show up. One-time cleanup also
      // removes any example trips a previous version of the app seeded in.
      db.doc('meta/examples_removed').get().then(function(snap){
        if (!snap.exists){
          tripsCol.get().then(function(colSnap){
            (colSnap.docs||[]).forEach(function(d){
              var data = (d.data && d.data()) || {};
              if (data.isExample) tripsCol.doc(d.id).delete();
            });
          }).catch(function(){ /* cleanup is best-effort */ });
          db.doc('meta/examples_removed').set({ removedAt: new Date().toISOString() });
        }
      }).catch(function(){ /* cleanup is best-effort */ });
    }).catch(function(){
      tryLocalStorageFallback();
    });
  }

  if (document.readyState==='loading'){
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }
})();
</script>

<script>
  // Registers the service worker so the app is installable and works offline.
  // No-op when served through the Claude artifact viewer (relative path
  // simply won't resolve to anything meaningful there).
  if ('serviceWorker' in navigator){
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('./sw.js').catch(function(){ /* offline support is best-effort */ });
    });
  }
</script>
